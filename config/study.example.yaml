# study.example.yaml — fmri-bids-recon study configuration template
#
# Copy this file to config/study.yaml (or any path you prefer) and fill in
# the placeholder values before running the pipeline.  All fields marked
# REQUIRED must be present.  Fields marked OPTIONAL may be omitted; defaults
# are noted inline.
#
# Placeholder values below are intentionally generic.  Replace every value
# before use.
#
# NOTE: The task registry is maintained automatically in a sidecar file named
# <config-file>.registry.yaml (e.g., study.yaml.registry.yaml).  Do NOT add
# a task_registry key to this file; it will be ignored.  The sidecar is
# created and updated by the pipeline as new task labels are encountered.

# ---------------------------------------------------------------------------
# Directory layout
# ---------------------------------------------------------------------------

# REQUIRED. Absolute path to the BIDS dataset root directory.  This directory
# should already exist and may already contain sub-* directories from prior
# runs.  study_name is derived automatically from this directory's basename.
bids_root: '/absolute/path/to/bids_root'

# REQUIRED. Absolute path to the pipeline staging scratch directory.  The
# pipeline writes intermediate files here before committing outputs to
# bids_root.  MUST NOT be a subdirectory of bids_root (concurrency hazard).
staging_root: '/absolute/path/to/staging'

# REQUIRED. Absolute path to the raw DICOM root directory.  Subject- and
# session-specific paths are resolved by combining dicom_root with the
# dicom_template below.
dicom_root: '/absolute/path/to/raw/dicoms'

# REQUIRED. Per-subject/session path template relative to dicom_root.
# {subject} is replaced by each ID from the subjects list.
# {session} is replaced by each label from the sessions list.
# Any other text is treated as a literal directory name.
#
# Examples:
#   '{subject}/{session}'                -> dicom_root/001/01
#   '{subject}/ses-{session}/DICOMS'     -> dicom_root/001/ses-01/DICOMS
#   'wave{session}/{subject}/raw'        -> dicom_root/wave01/001/raw
dicom_template: '{subject}/{session}'

# ---------------------------------------------------------------------------
# Subjects and sessions
# ---------------------------------------------------------------------------

# REQUIRED. Subject IDs to process, specified as either:
#   (a) An inline YAML list:  subjects: ['001', '002']
#   (b) An absolute path to a single-column text file:
#       subjects: '/absolute/path/to/subject_ids.txt'
#       (blank lines and # comment lines are skipped)
#
# Each entry must be alphanumeric (^[a-zA-Z0-9]+$).  Do NOT include the
# "sub-" prefix.  Duplicate entries are rejected.
subjects:
  - '001'
  - '002'

# REQUIRED. List of session labels to process.  May be specified as a
# multi-line list (below) or inline: sessions: ['01', '02']
#
# Each entry must be a zero-padded integer with at least 2 digits
# (^[0-9]{2,}$).  Do NOT include the "ses-" prefix.  Duplicate entries
# are rejected.
#
# The pipeline resolves DICOM paths for every (subject, session) combination
# (cross product of subjects x sessions).  Pairs whose resolved path does not
# exist on disk are skipped with an INFO-level log message; no error is raised
# unless ALL pairs are missing.
sessions:
  - '01'
  - '02'

# ---------------------------------------------------------------------------
# Optional features
# ---------------------------------------------------------------------------

# OPTIONAL. Set to true to enable physiological data extraction (e.g., cardiac
# and respiratory traces).  Defaults to false when omitted.
physio: false

# OPTIONAL. Set to true to enable anatomical defacing via pydeface.
# Requires FSL (specifically flirt) to be installed and on PATH.
# Defaced copies are written to derivatives/defaced/; the analysis
# anat/ directories are never modified. Defaults to false when omitted.
deface: false

# ---------------------------------------------------------------------------
# Classification and guard tuning (all OPTIONAL; defaults shown are safe for
# most studies). See INPUT_SPECIFICATION.md Section 1.2 for full details.
# ---------------------------------------------------------------------------

# OPTIONAL. Series-description substrings (case-insensitive) identifying
# localizer/scout sequences to drop. Overrides (does not extend) the default
# list shown below.
# scout_keywords:
#   - 'scout'
#   - 'localizer'
#   - 'survey'
#   - '3-plane'
#   - '3plane'
#   - 'aascout'
#   - 'aahscout'
#   - 'locator'
#   - 'scanogram'
#   - 'plan scan'
#   - 'planscan'
#   - 'topogram'

# OPTIONAL. Series-description substrings (case-insensitive) identifying
# navigator/calibration sequences (e.g., Siemens vNav "setter") eligible for
# demotion during calibration sequence exclusion. Overrides the default list.
# calibration_keywords:
#   - 'setter'
#   - 'prescan'
#   - '_cal_'
#   - 'calibration'
#   - 'coilsurv'

# OPTIONAL. ImageType/ImageTypeText tokens identifying the "normalized"
# member of a vendor reconstruction-variant pair (Siemens NORM, GE PURE,
# Philips SCIC/CLEAR). Used to prefer the normalized anatomical
# reconstruction over its non-normalized twin. Overrides the default list.
# norm_tokens:
#   - 'NORM'
#   - 'PURE'
#   - 'SCIC'
#   - 'CLEAR'

# OPTIONAL. Per-modality expected anatomical count (T1W and/or T2W). When
# set, a modality whose surviving count exceeds its expectation triggers a
# calibration-keyword demotion pass before falling back to a
# DUPLICATE_MODALITY warning. Defaults to null (no gate; unconditional
# DUPLICATE_MODALITY warning on any anatomical over-count).
# expected_anat_count:
#   T1W: 1
#   T2W: 1

# OPTIONAL. 'strict' (exclude a volume-count-mismatched known series) or
# 'advisory' (retain it with a warning instead). Defaults to 'advisory'.
# registry_mode: 'advisory'

# OPTIONAL. 'frozen' (halt on label drift from the registry) or 're-derive'
# (accept the fresh label with an advisory warning). Defaults to 'frozen'.
# label_freeze_mode: 'frozen'

# OPTIONAL. 'strict' (halt on a rename-collision signature match), 'warn'
# (advisory warning and continue), or 'off' (skip the check). Defaults to
# 'warn'.
# rename_detection: 'warn'
